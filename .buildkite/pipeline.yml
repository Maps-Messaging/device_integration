steps:
  - label: ":maven: Build and Deploy"
    command:
      - export SONAR_TOKEN=$(buildkite-agent secret get SONAR_TOKEN)
      - export NVD_API_KEY=$(buildkite-agent secret get nvd_api_key)
      - mvn -Dgpg.skip=true -DskipTests=true clean deploy -Psnapshot -U -Ddependency-check.skip=true
      - mvn -Psnapshot org.sonarsource.scanner.maven:sonar-maven-plugin:5.7.0.6970:sonar -Dsonar.token=${SONAR_TOKEN} -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

    env:
      BUILDKITE_ANALYTICS_TOKEN: "$(buildkite-agent secret get DeviceIntegrationBuildkiteAnalytics)"
    agents:
      queue: "java_build_queue_aws"
